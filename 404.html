<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050706">
  <title>Signal Lost | Central Command</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f2f7f1; background: radial-gradient(circle, #172313, #050706 65%); text-align: center; }
    main { max-width: 650px; padding: 48px; border: 1px solid rgba(196,255,54,.28); background: rgba(8,12,9,.86); }
    p:first-child { color: #c4ff36; font-size: 12px; font-weight: 900; letter-spacing: .24em; }
    h1 { margin: 14px 0; font-size: clamp(50px, 12vw, 92px); line-height: .85; text-transform: uppercase; }
    p { color: #9aa69e; line-height: 1.7; }
    a { display: inline-block; margin-top: 18px; padding: 13px 18px; color: #0b1200; background: #c4ff36; font-weight: 900; text-decoration: none; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <p>ERROR 404</p>
    <h1>Signal Lost</h1>
    <p>Central Command could not locate that destination.</p>
    <a href="./">Return to Central Command</a>
  </main>
</body>
</html>
